app = "rag-ley-19628-grupo1"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  GRADIO_ANALYTICS_ENABLED = "False"
  GRADIO_SERVER_NAME = "0.0.0.0"
  GRADIO_SERVER_PORT = "7860"
  QDRANT_COLLECTION = "ley_21719_rag_prod"

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[deploy]
  strategy = "rolling"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
